[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "pg-tasks"
version = "0.0.2"
authors = [
    {name = "Sergei Variasov", email = "variasov@gmail.com"},
]
description = "Python client for pg_tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "psycopg~=3.3",
    "psycopg_pool~=3.3",
    "frozendict~=2.4",
]

[project.urls]
Homepage = "https://github.com/variasov/pg-tasks-python"

[tool.setuptools.packages.find]
where = ["sources"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest~=9.0",
    "psycopg~=3.3",
    "pytest==9.0.2",
    "classic-db-tools~=1.0",
    "classic-operations",
    "classic-scenarios",
    "classic-components",
    "classic-health-checks~=0.1",
    "pydantic",
    "pydantic_settings",
    "gevent~=25.9",
]
